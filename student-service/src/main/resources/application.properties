spring.application.name=student-service
server.port=9091

course.service.url=http://localhost:9090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

resilience4j.circuitbreaker.instances.courseService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.courseService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.courseService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.courseService.waitDurationInOpenState=10s

resilience4j.retry.instances.courseService.maxAttempts=3
resilience4j.retry.instances.courseService.waitDuration=2s
