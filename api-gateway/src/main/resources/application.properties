spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Student Service Route
spring.cloud.gateway.server.webflux.routes[0].id=student-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/students/**

# Course Service Route
spring.cloud.gateway.server.webflux.routes[1].id=course-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://COURSE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/courses/**
